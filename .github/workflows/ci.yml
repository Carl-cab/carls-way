name: CI

on:
  pull_request:
    branches: [master, 'integration/**']
  push:
    branches: [master, 'integration/**']

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The audit suite exercises real repository SQL. Running it against a real
      # PostgreSQL server is deliberate: a hand-written fake would test the fake.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test database only. No production credential is ever present in CI, and
      # MANNA_ENV is deliberately left unset so the KYC tests exercise the
      # fail-closed production default.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/manna_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The same command Vercel runs, so CI and deploys resolve an identical
      # dependency graph. A package.json change that forgets the lockfile fails
      # here rather than silently breaking the next deploy — which is exactly
      # what happened while this repo carried two lockfiles and CI checked only
      # the one Vercel ignores.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test schema
        run: psql "postgres://postgres:postgres@127.0.0.1:5432/manna_test" -f lib/__tests__/helpers/test-schema.sql
        env:
          PGPASSWORD: postgres

      - name: Typecheck
        id: typecheck
        run: pnpm run typecheck

      - name: Lint
        id: lint
        run: pnpm run lint

      - name: Test
        id: test
        run: pnpm test

      - name: Build
        id: build
        run: pnpm run build

      - name: Assert no live provider flag is enabled
        run: |
          if grep -rEn "(PLAID_TRANSFER_LIVE|CA_EFT_LIVE)\s*[:=]\s*['\"]?true" \
               --include='*.ts' --include='*.tsx' --include='*.json' \
               --include='*.yml' --include='*.yaml' . \
               | grep -v node_modules; then
            echo "::error::A live provider flag appears to be enabled in committed code."
            exit 1
          fi
          echo "No live provider flags enabled."

      # Owner-facing progress report, rendered into this run's summary page.
      #
      # Deliberately not a web application: the GitHub Actions summary is
      # already authenticated to people who can see the repository, needs no
      # new credential or deployment, and cannot be reached by the public.
      # The report prints no secrets, customer data or transaction detail —
      # its inputs are git, a committed JSON file, and the values passed here.
      #
      # `if: always()` so the report still appears when an earlier step failed;
      # that is exactly when the owner most wants to see where things stand.
      #
      # Each check reports its OWN step outcome, not the job's. `job.status`
      # was wrong in both directions: these steps are sequential and
      # fail-fast, so a Typecheck failure leaves Lint, Test and Build
      # *skipped* while the job reads failure — labelling all three "see job
      # log" claims they ran. And a Build failure would mark Typecheck, which
      # passed, with the same warning. A report that misattributes a failure
      # is worse than one that says NOT RUN.
      - name: Progress report
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          set -uo pipefail
          # Map a step outcome onto report wording. An empty outcome means the
          # step never reached (job cancelled earlier), which is also NOT RUN.
          label() {
            case "$1" in
              success)  printf '✅ clean' ;;
              failure)  printf '⚠️ failed — see job log' ;;
              skipped|'') printf '⬜ NOT RUN (earlier step failed)' ;;
              *)        printf '⬜ NOT RUN (%s)' "$1" ;;
            esac
          }
          pnpm run status -- \
            --typecheck="$(label "$TYPECHECK")" \
            --lint="$(label "$LINT")" \
            --test-outcome="$(label "$TEST")" \
            --build="$(label "$BUILD")" \
            >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Audit pnpm-lock.yaml directly. Generating package-lock.json with npm
      # resolves a fresh compatible tree rather than the exact dependencies Vercel
      # deploys from pnpm-lock.yaml; that can mask a vulnerable locked transitive
      # package. The production audit must examine the deployed lockfile.
      #
      # Advisory endpoints are not dependable. A registry outage is an
      # availability signal, not evidence of a clean tree, so distinguish it from
      # a valid audit response containing high/critical findings.
      #
      # This step separates two outcomes that a bare audit command conflates:
      #
      #   the audit ran and found high/critical advisories  -> fail the build
      #   the audit could not reach the service             -> warn, but pass
      #
      # A registry outage is an availability signal, not a security one, and
      # failing every push on it would train people to ignore a red gate. The
      # gate itself is unchanged: still high and above, nothing suppressed,
      # and a real finding still fails. GitHub's Dependabot alerts are the
      # durable backstop, since they do not depend on this endpoint at CI time.
      # Two tiers, deliberately.
      #
      # The blocking tier audits the production tree only (--prod), because
      # that is what gets deployed. The advisory tier audits everything and only
      # warns, so a dev-chain finding is still visible in CI without wedging
      # every PR behind something that cannot be fixed.
      #
      # What forced the split: GHSA-vfj7-8cjw-p6xm (braces, stack-exhaustion
      # DoS) reaches the tree as
      #   eslint-config-next -> @next/eslint-plugin-next -> fast-glob
      #                      -> micromatch -> braces
      # and its vulnerable range is `*` — every published version, 3.0.3
      # included. No override or pin resolves it; npm's only offered fix is
      # downgrading eslint-config-next to 14.2.35, which is incompatible with
      # Next 16. eslint-config-next is a devDependency, and the production
      # pnpm audit reports zero findings at every severity for that dev chain, so
      # nothing that ships is affected.
      #
      # This narrows what blocks a merge; it does not stop anything being
      # reported. A production-tree finding still fails the build, nothing is
      # suppressed, and Dependabot remains the durable backstop for the dev
      # chain.
      - name: pnpm audit — production tree (blocking, high and above)
        timeout-minutes: 6
        run: |
          set -uo pipefail
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::No pnpm-lock.yaml to audit. This is a broken audit setup, not a registry outage."
            exit 1
          fi
          for attempt in 1 2 3; do
            if timeout 90 pnpm audit --prod --json > audit.json 2> audit.err; then
              echo "Audit clean."
              exit 0
            fi
            # A non-zero exit means either findings or failure to run. Valid
            # JSON with a vulnerabilities block means the audit actually ran.
            if jq -e '.metadata.vulnerabilities' audit.json > /dev/null 2>&1; then
              high=$(jq '.metadata.vulnerabilities.high // 0' audit.json)
              crit=$(jq '.metadata.vulnerabilities.critical // 0' audit.json)
              echo "Audit ran: ${crit} critical, ${high} high."
              if [ "$high" -gt 0 ] || [ "$crit" -gt 0 ]; then
                pnpm audit --prod --audit-level=high || true
                echo "::error::Production dependency audit found ${crit} critical and ${high} high advisories."
                exit 1
              fi
              echo "No high or critical advisories."
              exit 0
            fi
            echo "Attempt ${attempt}: advisory service did not answer."
            sed -n '1,5p' audit.err || true
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::warning::Dependency audit skipped — registry.npmjs.org's advisory service did not respond after three attempts. This is an availability failure, not a clean bill of health. Check Dependabot alerts."

      # Advisory only: never fails the build. This is where a dev-chain finding
      # shows up, including the braces advisory described above. Read it; do not
      # ignore it because it cannot fail the job.
      - name: pnpm audit — full tree including devDependencies (advisory)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          set -uo pipefail
          if timeout 90 pnpm audit --json > audit-all.json 2> audit-all.err; then
            echo "Full-tree audit clean, devDependencies included."
            exit 0
          fi
          if jq -e '.metadata.vulnerabilities' audit-all.json > /dev/null 2>&1; then
            crit=$(jq '.metadata.vulnerabilities.critical // 0' audit-all.json)
            high=$(jq '.metadata.vulnerabilities.high // 0' audit-all.json)
            mod=$(jq '.metadata.vulnerabilities.moderate // 0' audit-all.json)
            pnpm audit --audit-level=moderate || true
            if [ "$crit" -gt 0 ] || [ "$high" -gt 0 ]; then
              echo "::warning::Full tree (devDependencies included): ${crit} critical, ${high} high, ${mod} moderate. These do not ship, so they do not block the merge — but check whether any is newly fixable."
            else
              echo "Full tree: ${mod} moderate, no high or critical."
            fi
            exit 0
          fi
          echo "::warning::Full-tree audit could not reach the advisory service. Check Dependabot alerts."

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Least privilege. The default token is broader than a read-only scan needs,
    # and this job runs a downloaded binary over the whole history.
    permissions:
      contents: read

    steps:
      # Full history, not just the PR's commits. A credential committed and
      # then "removed" in a later commit is still in the pack and still
      # exposed, so a diff-only scan would call that clean. 92 non-merge
      # commits scan in under a second, so there is no reason to narrow it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # This job downloads and executes a third-party binary. Checkout
          # persists the job token into .git/config by default, where that
          # binary could read it; nothing here performs a later Git operation
          # that needs it.
          persist-credentials: false

      # Pinned by version AND verified by the checksum from the release's own
      # manifest, so the job cannot silently start running a different binary.
      # Using the published binary rather than a marketplace action keeps the
      # control free of a third-party action's licensing and release cadence.
      - name: Install Gitleaks ${{ env.GITLEAKS_VERSION }}
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --redact is load-bearing, not hygiene. Measured: without it the full
      # secret appears twice in the JSON report, which CI logs and artifacts
      # retain; with it, zero times. A scanner that prints the credential it
      # found turns a private leak into a public one.
      - name: Scan history for committed credentials
        id: scan
        run: |
          set -uo pipefail
          ./gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            . && echo "clean=true" >> "$GITHUB_OUTPUT" || echo "clean=false" >> "$GITHUB_OUTPUT"

      # --redact does NOT cover everything the SARIF writer emits. Measured on
      # gitleaks 8.21.2: when a credential also appears in the commit message,
      # the full value survives at
      # .runs[].results[].partialFingerprints.commitMessage even with --redact.
      # An uploaded artifact would therefore publish the credential that the
      # scan was supposed to protect. Strip that field before upload.
      #
      # partialFingerprints only aids alert de-duplication across runs; the
      # file, line and rule — everything a reviewer needs to locate the finding
      # — live elsewhere in the document and are untouched.
      - name: Strip commit messages from the SARIF
        id: sanitize
        if: always() && hashFiles('gitleaks.sarif') != ''
        run: |
          set -euo pipefail
          jq 'del(.runs[]?.results[]?.partialFingerprints.commitMessage)' \
            gitleaks.sarif > gitleaks.redacted.sarif
          mv gitleaks.redacted.sarif gitleaks.sarif
          if jq -e '[.runs[]?.results[]?.partialFingerprints.commitMessage] | length > 0' \
               gitleaks.sarif >/dev/null; then
            echo "::error::commitMessage survived stripping; refusing to upload"
            exit 1
          fi

      # Uploaded whatever the SCAN's outcome — a clean run and a detection are
      # both worth keeping — but only if sanitization actually succeeded.
      #
      # `hashFiles(...) != ''` alone was not enough, and the difference matters:
      # if jq or mv fails, the ORIGINAL unsanitized file is still on disk and
      # still hashes non-empty, so the upload would publish exactly the
      # unredacted commit message the step above exists to remove. Gating on the
      # step's outcome means a broken sanitizer loses the artifact rather than
      # leaking through it.
      - name: Upload redacted findings
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 14

      # A detection is an incident, not a failing lint rule. Deleting the line
      # and force-pushing does NOT remediate it: the credential was pushed to a
      # remote, is in the reflog and any fork or clone, and must be assumed
      # compromised. The only remediation is rotation at the provider.
      - name: Fail with the incident requirement
        if: steps.scan.outputs.clean != 'true'
        run: |
          echo "::error title=Credential detected::A credential was found in this repository's history."
          cat <<'MSG'
          REQUIRED, IN THIS ORDER:

            1. ROTATE the credential at the provider now (Plaid, Stripe, Wise,
               Supabase, or the JWT signing secret). Assume it is compromised
               from the moment it was pushed. Removing the commit does not
               un-expose it — it is in the remote, the reflog, and any clone or
               fork.
            2. Record the exposure: what credential, which commit, when pushed,
               when rotated, and what it could reach while valid.
            3. Only then clean the history, if you choose to.
            4. If it reached production, treat it as an access incident and
               review the provider's logs for use you did not authorise.

          The redacted SARIF artifact on this run shows the file and line
          without the value. Do not paste the value into an issue or a PR.

          If this is a genuine false positive, add a NARROW exception to
          .gitleaks.toml keyed on the literal, not the path — a path exemption
          would also hide a real credential added to that file later.
          MSG
          exit 1
