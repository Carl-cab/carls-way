name: CI

on:
  pull_request:
    branches: [master, 'integration/**']
  push:
    branches: [master, 'integration/**']

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The audit suite exercises real repository SQL. Running it against a real
      # PostgreSQL server is deliberate: a hand-written fake would test the fake.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test database only. No production credential is ever present in CI, and
      # MANNA_ENV is deliberately left unset so the KYC tests exercise the
      # fail-closed production default.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/manna_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The same command Vercel runs, so CI and deploys resolve an identical
      # dependency graph. A package.json change that forgets the lockfile fails
      # here rather than silently breaking the next deploy — which is exactly
      # what happened while this repo carried two lockfiles and CI checked only
      # the one Vercel ignores.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test schema
        run: psql "postgres://postgres:postgres@127.0.0.1:5432/manna_test" -f lib/__tests__/helpers/test-schema.sql
        env:
          PGPASSWORD: postgres

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Assert no live provider flag is enabled
        run: |
          if grep -rEn "(PLAID_TRANSFER_LIVE|CA_EFT_LIVE)\s*[:=]\s*['\"]?true" \
               --include='*.ts' --include='*.tsx' --include='*.json' \
               --include='*.yml' --include='*.yaml' . \
               | grep -v node_modules; then
            echo "::error::A live provider flag appears to be enabled in committed code."
            exit 1
          fi
          echo "No live provider flags enabled."

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The rest of this workflow installs with pnpm, which is what Vercel
      # runs. The audit is the one exception, because `pnpm audit` queries
      # registry.npmjs.org/-/npm/v1/security/audits/quick, which returned
      # socket timeouts and a 500 on two consecutive runs here and hung until
      # the job timed out. `npm audit` queries the bulk advisories endpoint
      # instead, which answered in about twenty seconds on these same runners.
      #
      # No lockfile is committed for npm any more, so one is generated in the
      # runner's workspace. It is never committed. Resolution is from the
      # ranges in package.json, so it can differ slightly from what pnpm-lock
      # pins; for an advisory gate that is an acceptable approximation, and a
      # gate that reports is worth more than one that cannot run.
      - name: Generate an npm lockfile for auditing only
        run: npm install --package-lock-only --no-audit
      # Advisory for now: fails the job only on high/critical advisories so a
      # newly published low-severity advisory cannot block an unrelated fix.
      - name: npm audit (high and above)
        timeout-minutes: 5
        run: npm audit --audit-level=high
