name: CI

on:
  pull_request:
    branches: [master, 'integration/**']
  push:
    branches: [master, 'integration/**']

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The audit suite exercises real repository SQL. Running it against a real
      # PostgreSQL server is deliberate: a hand-written fake would test the fake.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test database only. No production credential is ever present in CI, and
      # MANNA_ENV is deliberately left unset so the KYC tests exercise the
      # fail-closed production default.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/manna_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The same command Vercel runs, so CI and deploys resolve an identical
      # dependency graph. A package.json change that forgets the lockfile fails
      # here rather than silently breaking the next deploy — which is exactly
      # what happened while this repo carried two lockfiles and CI checked only
      # the one Vercel ignores.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test schema
        run: psql "postgres://postgres:postgres@127.0.0.1:5432/manna_test" -f lib/__tests__/helpers/test-schema.sql
        env:
          PGPASSWORD: postgres

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Assert no live provider flag is enabled
        run: |
          if grep -rEn "(PLAID_TRANSFER_LIVE|CA_EFT_LIVE)\s*[:=]\s*['\"]?true" \
               --include='*.ts' --include='*.tsx' --include='*.json' \
               --include='*.yml' --include='*.yaml' . \
               | grep -v node_modules; then
            echo "::error::A live provider flag appears to be enabled in committed code."
            exit 1
          fi
          echo "No live provider flags enabled."

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The rest of this workflow installs with pnpm, which is what Vercel
      # runs. The audit is the one exception: it needs an npm-shaped tree, and
      # no npm lockfile is committed any more, so one is generated here in the
      # runner and never committed. Resolution comes from the ranges in
      # package.json rather than pnpm-lock's pins — an acceptable
      # approximation for an advisory gate.
      - name: Generate an npm lockfile for auditing only
        run: npm install --package-lock-only --no-audit

      # registry.npmjs.org's advisory endpoints are not dependable. pnpm's
      # (audits/quick) returned socket timeouts and a 500 and hung to the job
      # timeout; npm's (advisories/bulk) answered in 35s on one run and then
      # hung past five minutes on the next, three minutes later. Both clients
      # are affected, intermittently.
      #
      # So this step separates two outcomes that a bare `npm audit` conflates:
      #
      #   the audit ran and found high/critical advisories  -> fail the build
      #   the audit could not reach the service             -> warn, but pass
      #
      # A registry outage is an availability signal, not a security one, and
      # failing every push on it would train people to ignore a red gate. The
      # gate itself is unchanged: still high and above, nothing suppressed,
      # and a real finding still fails. GitHub's Dependabot alerts are the
      # durable backstop, since they do not depend on this endpoint at CI time.
      - name: npm audit (high and above, tolerant of registry outages)
        timeout-minutes: 6
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if timeout 90 npm audit --json > audit.json 2> audit.err; then
              echo "Audit clean."
              exit 0
            fi
            # A non-zero exit means either findings or failure to run. Valid
            # JSON with a vulnerabilities block means the audit actually ran.
            if jq -e '.metadata.vulnerabilities' audit.json > /dev/null 2>&1; then
              high=$(jq '.metadata.vulnerabilities.high // 0' audit.json)
              crit=$(jq '.metadata.vulnerabilities.critical // 0' audit.json)
              echo "Audit ran: ${crit} critical, ${high} high."
              if [ "$high" -gt 0 ] || [ "$crit" -gt 0 ]; then
                npm audit --audit-level=high || true
                echo "::error::Dependency audit found ${crit} critical and ${high} high advisories."
                exit 1
              fi
              echo "No high or critical advisories."
              exit 0
            fi
            echo "Attempt ${attempt}: advisory service did not answer."
            sed -n '1,5p' audit.err || true
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::warning::Dependency audit skipped — registry.npmjs.org's advisory service did not respond after three attempts. This is an availability failure, not a clean bill of health. Check Dependabot alerts."
