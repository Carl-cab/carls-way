name: CI

on:
  pull_request:
    branches: [master, 'integration/**']
  push:
    branches: [master, 'integration/**']

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The audit suite exercises real repository SQL. Running it against a real
      # PostgreSQL server is deliberate: a hand-written fake would test the fake.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test database only. No production credential is ever present in CI, and
      # MANNA_ENV is deliberately left unset so the KYC tests exercise the
      # fail-closed production default.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/manna_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The same command Vercel runs, so CI and deploys resolve an identical
      # dependency graph. A package.json change that forgets the lockfile fails
      # here rather than silently breaking the next deploy — which is exactly
      # what happened while this repo carried two lockfiles and CI checked only
      # the one Vercel ignores.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test schema
        run: psql "postgres://postgres:postgres@127.0.0.1:5432/manna_test" -f lib/__tests__/helpers/test-schema.sql
        env:
          PGPASSWORD: postgres

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Assert no live provider flag is enabled
        run: |
          if grep -rEn "(PLAID_TRANSFER_LIVE|CA_EFT_LIVE)\s*[:=]\s*['\"]?true" \
               --include='*.ts' --include='*.tsx' --include='*.json' \
               --include='*.yml' --include='*.yaml' . \
               | grep -v node_modules; then
            echo "::error::A live provider flag appears to be enabled in committed code."
            exit 1
          fi
          echo "No live provider flags enabled."

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Audit pnpm-lock.yaml directly. Generating package-lock.json with npm
      # resolves a fresh compatible tree rather than the exact dependencies Vercel
      # deploys from pnpm-lock.yaml; that can mask a vulnerable locked transitive
      # package. The production audit must examine the deployed lockfile.
      #
      # Advisory endpoints are not dependable. A registry outage is an
      # availability signal, not evidence of a clean tree, so distinguish it from
      # a valid audit response containing high/critical findings.
      #
      # This step separates two outcomes that a bare audit command conflates:
      #
      #   the audit ran and found high/critical advisories  -> fail the build
      #   the audit could not reach the service             -> warn, but pass
      #
      # A registry outage is an availability signal, not a security one, and
      # failing every push on it would train people to ignore a red gate. The
      # gate itself is unchanged: still high and above, nothing suppressed,
      # and a real finding still fails. GitHub's Dependabot alerts are the
      # durable backstop, since they do not depend on this endpoint at CI time.
      # Two tiers, deliberately.
      #
      # The blocking tier audits the production tree only (--prod), because
      # that is what gets deployed. The advisory tier audits everything and only
      # warns, so a dev-chain finding is still visible in CI without wedging
      # every PR behind something that cannot be fixed.
      #
      # What forced the split: GHSA-vfj7-8cjw-p6xm (braces, stack-exhaustion
      # DoS) reaches the tree as
      #   eslint-config-next -> @next/eslint-plugin-next -> fast-glob
      #                      -> micromatch -> braces
      # and its vulnerable range is `*` — every published version, 3.0.3
      # included. No override or pin resolves it; npm's only offered fix is
      # downgrading eslint-config-next to 14.2.35, which is incompatible with
      # Next 16. eslint-config-next is a devDependency, and the production
      # pnpm audit reports zero findings at every severity for that dev chain, so
      # nothing that ships is affected.
      #
      # This narrows what blocks a merge; it does not stop anything being
      # reported. A production-tree finding still fails the build, nothing is
      # suppressed, and Dependabot remains the durable backstop for the dev
      # chain.
      - name: pnpm audit — production tree (blocking, high and above)
        timeout-minutes: 6
        run: |
          set -uo pipefail
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::No pnpm-lock.yaml to audit. This is a broken audit setup, not a registry outage."
            exit 1
          fi
          for attempt in 1 2 3; do
            if timeout 90 pnpm audit --prod --json > audit.json 2> audit.err; then
              echo "Audit clean."
              exit 0
            fi
            # A non-zero exit means either findings or failure to run. Valid
            # JSON with a vulnerabilities block means the audit actually ran.
            if jq -e '.metadata.vulnerabilities' audit.json > /dev/null 2>&1; then
              high=$(jq '.metadata.vulnerabilities.high // 0' audit.json)
              crit=$(jq '.metadata.vulnerabilities.critical // 0' audit.json)
              echo "Audit ran: ${crit} critical, ${high} high."
              if [ "$high" -gt 0 ] || [ "$crit" -gt 0 ]; then
                pnpm audit --prod --audit-level=high || true
                echo "::error::Production dependency audit found ${crit} critical and ${high} high advisories."
                exit 1
              fi
              echo "No high or critical advisories."
              exit 0
            fi
            echo "Attempt ${attempt}: advisory service did not answer."
            sed -n '1,5p' audit.err || true
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::warning::Dependency audit skipped — registry.npmjs.org's advisory service did not respond after three attempts. This is an availability failure, not a clean bill of health. Check Dependabot alerts."

      # Advisory only: never fails the build. This is where a dev-chain finding
      # shows up, including the braces advisory described above. Read it; do not
      # ignore it because it cannot fail the job.
      - name: pnpm audit — full tree including devDependencies (advisory)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          set -uo pipefail
          if timeout 90 pnpm audit --json > audit-all.json 2> audit-all.err; then
            echo "Full-tree audit clean, devDependencies included."
            exit 0
          fi
          if jq -e '.metadata.vulnerabilities' audit-all.json > /dev/null 2>&1; then
            crit=$(jq '.metadata.vulnerabilities.critical // 0' audit-all.json)
            high=$(jq '.metadata.vulnerabilities.high // 0' audit-all.json)
            mod=$(jq '.metadata.vulnerabilities.moderate // 0' audit-all.json)
            pnpm audit --audit-level=moderate || true
            if [ "$crit" -gt 0 ] || [ "$high" -gt 0 ]; then
              echo "::warning::Full tree (devDependencies included): ${crit} critical, ${high} high, ${mod} moderate. These do not ship, so they do not block the merge — but check whether any is newly fixable."
            else
              echo "Full tree: ${mod} moderate, no high or critical."
            fi
            exit 0
          fi
          echo "::warning::Full-tree audit could not reach the advisory service. Check Dependabot alerts."
